name: Native Voro++ large-radius reproducer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  minimal-linux:
    name: "Minimal native reproduction / Linux GCC"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original failures and combined correction
        shell: bash
        run: bash ./scripts/reproduce.sh
      - name: Preserve minimal measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-linux-gcc
          path: |
            output/baseline/*_minimal.txt
            output/combined-02-03/*_minimal.txt
          if-no-files-found: error

  minimal-msvc:
    name: "Minimal native reproduction / Windows MSVC"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify original failures and combined correction
        shell: pwsh
        run: |
          pwsh -File ./scripts/run-msvc.ps1 -Mode baseline -Suite minimal
          if ($LASTEXITCODE -ne 0) { throw "Original minimal reproduction failed" }
          pwsh -File ./scripts/run-msvc.ps1 -Mode combined-02-03 -Suite minimal
          if ($LASTEXITCODE -ne 0) { throw "Combined minimal regression failed" }
      - name: Preserve minimal measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-windows-msvc
          path: |
            output/baseline/*_minimal.txt
            output/combined-02-03/*_minimal.txt
          if-no-files-found: error

  dev-baseline-minimal:
    name: "Dev baseline and correction / ${{ matrix.platform.tag }}"
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {os: ubuntu-latest, tag: linux-gcc-o2, cxx: g++, flags: "-O2 -std=c++11"}
          - {os: ubuntu-latest, tag: linux-clang-o3, cxx: clang++, flags: "-O3 -std=c++11"}
          - {os: macos-15, tag: macos-arm64-clang-o2, cxx: clang++, flags: "-O2 -std=c++11"}
          - {os: macos-15-intel, tag: macos-intel-clang-o3, cxx: clang++, flags: "-O3 -std=c++11"}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and reproduce native dev errors
        shell: bash
        env:
          CXX: ${{ matrix.platform.cxx }}
          CXXFLAGS: ${{ matrix.platform.flags }}
        run: |
          uname -a
          $CXX --version
          if [[ "${{ matrix.platform.tag }}" == macos-arm64-* ]]; then test "$(uname -m)" == arm64; fi
          if [[ "${{ matrix.platform.tag }}" == macos-intel-* ]]; then test "$(uname -m)" == x86_64; fi
          bash ./scripts/reproduce-dev.sh extended
      - name: Save dev branch baseline measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-baseline-and-correction-${{ matrix.platform.tag }}
          path: |
            output/dev-baseline/*.txt
            output/dev-combined/*.txt
          if-no-files-found: warn

  reproduce:
    name: "${{ matrix.platform.tag }} / ${{ matrix.profile }}"
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, candidate, candidate-02, candidate-03, combined-02-03]
        platform:
          - {os: ubuntu-latest, tag: linux-gcc-o2, cxx: g++, flags: "-O2 -std=c++11"}
          - {os: ubuntu-latest, tag: linux-clang-o3, cxx: clang++, flags: "-O3 -std=c++11"}
          - {os: macos-15, tag: macos-arm64-clang-o2, cxx: clang++, flags: "-O2 -std=c++11"}
          - {os: macos-15-intel, tag: macos-intel-clang-o3, cxx: clang++, flags: "-O3 -std=c++11"}
    steps:
      - uses: actions/checkout@v4
      - name: Environment and compiler
        shell: bash
        run: |
          uname -a
          ${{ matrix.platform.cxx }} --version
          case "${{ matrix.platform.tag }}" in
            macos-arm64-*) test "$(uname -m)" = arm64 ;;
            macos-intel-*) test "$(uname -m)" = x86_64 ;;
          esac
      - name: Compile and execute native tests
        shell: bash
        env:
          CXX: ${{ matrix.platform.cxx }}
          CXXFLAGS: ${{ matrix.platform.flags }}
        run: bash ./run.sh "${{ matrix.profile }}"
      - name: Save native measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurements-${{ matrix.platform.tag }}-${{ matrix.profile }}
          path: output/
          if-no-files-found: warn

  windows-msvc:
    name: "windows-msvc-o2 / ${{ matrix.profile }}"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, candidate, candidate-02, candidate-03, combined-02-03]
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Environment information
        shell: pwsh
        run: |
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Get-Command cl.exe | Select-Object -ExpandProperty Source
          Write-Host "MSVC environment: $env:VSCMD_VER"
      - name: Compile and execute original native MSVC checks
        shell: pwsh
        run: ./scripts/run-msvc.ps1 -Mode "${{ matrix.profile }}"
      - name: Save MSVC measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurements-windows-msvc-o2-${{ matrix.profile }}
          path: output/
          if-no-files-found: warn
